name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npm run typecheck --if-present || npx tsc --noEmit

      - name: Build
        run: npm run build --if-present

      # TODO(Phase 1+): remove `continue-on-error` once real tests replace
      # npm's default placeholder script (`"test": "echo ... && exit 1"`).
      # Until then this step is informational only, so it doesn't block CI
      # on the placeholder's deliberate non-zero exit.
      - name: Test
        run: npm test --if-present
        continue-on-error: true

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npm run typecheck --if-present || npx tsc --noEmit

      - name: Build
        run: npm run build --if-present

      # TODO(Phase 1+): remove `continue-on-error` once real tests replace
      # npm's default placeholder script (`"test": "echo ... && exit 1"`).
      # Until then this step is informational only, so it doesn't block CI
      # on the placeholder's deliberate non-zero exit.
      - name: Test
        run: npm test --if-present
        continue-on-error: true

  status-check:
    name: CI Summary
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."